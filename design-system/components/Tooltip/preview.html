<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip — preview</title></head>
<body>
<div id="root" class="ds-demo"></div>
<script>
  var D = window.DesignSystem, h = React.createElement;
  function cap(t) { return h('div', { className: 'ds-demo__cap', key: 'cap-' + t }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(D.Tooltip,null,'Tooltip'), h(D.Tooltip,{placement:'bottom-left',onClose:function(){}},'Tooltip'), h(D.Tooltip,{placement:'top',onClose:function(){}},'Tooltip'), h(D.Tooltip,{placement:'right'},'Tooltip')));
</script>
</body>
</html>
